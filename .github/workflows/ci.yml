name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the compiler pinned in rust-toolchain.toml, resolved through
      # mise.lock, so CI and local checkouts build with the same rustc.
      - name: Install build tools
        uses: jdx/mise-action@v5
        with:
          version: "2026.11.14"
          # `mise-action` already exports `mise env`'s direct `.mise-bins` PATH.
          # Prepending `~/.local/share/mise/shims` via `GITHUB_PATH` makes
          # `mr-boxington-action` hydrate `.mbx-build-script-shims` with a mise
          # shim instead of the real `mbx` binary, which fails when Cargo runs
          # cached build scripts from `~/.cargo/registry`.
          add_shims_to_path: false

      # Restores Cargo's pruned target/ and registry from the newest entry, and
      # saves a new one only for a successful push to main. The tool step above
      # comes first because the cache key hashes the `rustc -vV` of the compiler
      # on PATH.
      - name: Cache Rust builds
        uses: jdx/mr-boxington-action@v1

      - name: Check formatting
        run: mise run fmt-check
      - name: Run clippy
        run: mise run lint
      - name: Run clippy (no default features)
        run: mise run lint-no-default
      - name: Run tests (all features)
        run: mise run test
      - name: Run tests (no default features)
        run: mise run test-no-default
      - name: Run clippy (OTAP compatibility suite)
        run: mise run otap-lint
      - name: Run OTAP compatibility tests
        run: mise run otap-test

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    # The MSRV floor in Cargo.toml, not the rust-toolchain.toml pin. Setting the
    # toolchain here overrides that file for every rustup proxy in the job.
    env:
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV (all features)
        run: cargo check --workspace --all-targets --all-features
      - name: Check MSRV (no default features)
        run: cargo check --workspace --all-targets --no-default-features

  go-fixtures:
    name: Go testdata sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/go-harness/go.mod
          cache-dependency-path: tests/go-harness/go.sum
      - name: Test fixture extractor
        working-directory: tests/go-harness
        run: go test ./...
      - name: Verify testdata is in sync with tests/go-harness/go.mod
        run: |
          cd tests/go-harness
          go generate ./...
          git diff --exit-code ../../testdata
