name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve OTAP compatibility lockfile for cache key
        run: cargo generate-lockfile --manifest-path tests/otap-compat/Cargo.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests/otap-compat -> target
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check formatting (OTAP compatibility suite)
        run: cargo fmt --manifest-path tests/otap-compat/Cargo.toml --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Run clippy (discovery only)
        run: cargo clippy --all-targets --no-default-features --features discovery -- -D warnings
      - name: Run clippy (http-config only)
        run: cargo clippy --all-targets --no-default-features --features http-config -- -D warnings
      - name: Run clippy (discovery-kubernetes only)
        run: cargo clippy --all-targets --no-default-features --features discovery-kubernetes -- -D warnings
      - name: Run tests (all features)
        run: cargo test --all-features
      - name: Run tests (no default features)
        run: cargo test --no-default-features
      - name: Run tests (discovery only)
        run: cargo test --no-default-features --features discovery
      - name: Run tests (http-config only)
        run: cargo test --no-default-features --features http-config
      - name: Run tests (discovery-kubernetes only)
        run: cargo test --no-default-features --features discovery-kubernetes
      - name: Run clippy (OTAP compatibility suite)
        env:
          CARGO_TARGET_DIR: target
        run: cargo clippy --manifest-path tests/otap-compat/Cargo.toml --all-targets -- -D warnings
      - name: Run OTAP compatibility tests
        env:
          CARGO_TARGET_DIR: target
        run: cargo test --manifest-path tests/otap-compat/Cargo.toml

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV (all features)
        run: cargo check --all-targets --all-features
      - name: Check MSRV (no default features)
        run: cargo check --all-targets --no-default-features
      - name: Check MSRV (discovery only)
        run: cargo check --all-targets --no-default-features --features discovery
      - name: Check MSRV (http-config only)
        run: cargo check --all-targets --no-default-features --features http-config
      - name: Check MSRV (discovery-kubernetes only)
        run: cargo check --all-targets --no-default-features --features discovery-kubernetes

  go-fixtures:
    name: Go testdata sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/go-harness/go.mod
          cache-dependency-path: tests/go-harness/go.sum
      - name: Test fixture extractor
        working-directory: tests/go-harness
        run: go test ./...
      - name: Verify testdata is in sync with tests/go-harness/go.mod
        run: |
          cd tests/go-harness
          go generate ./...
          git diff --exit-code ../../testdata
