[package]
name = "prometheus-scrape-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Prometheus service discovery, HTTP client configuration, and scrape pool management"
readme = "README.md"
keywords = ["prometheus", "openmetrics", "metrics", "scrape", "service-discovery"]
categories = ["network-programming", "asynchronous"]
exclude = [
    "benches/**",
    "tests/**",
]
# Kept unpublished while initial service discovery, HTTP config, and scrape pool modules land.
publish = false

[features]
default = ["arrow"]
arrow = ["prometheus-expfmt/arrow"]

[dependencies]
flate2 = { workspace = true }
futures-util = { workspace = true }
prometheus-expfmt = { workspace = true }
prometheus-relabel = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
benchfmt = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }

[[bench]]
name = "scrape"
harness = false
required-features = ["arrow"]

[lints]
workspace = true
