[package]
name = "prometheus-expfmt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Prometheus and OpenMetrics wire exposition format decoders for Apache Arrow (OTAP) and Protobuf DTOs"
readme = "README.md"
keywords = ["prometheus", "openmetrics", "metrics", "opentelemetry", "arrow"]
categories = ["parser-implementations", "encoding"]
exclude = [
    "benches/**",
    "tests/**",
]

[features]
default = ["arrow", "dto"]
arrow = ["dep:arrow-array", "dep:arrow-buffer", "dep:arrow-schema"]
dto = ["dep:prost", "dep:prost-types"]

[dependencies]
arrow-array = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
benchfmt = { workspace = true }
prost-build = { workspace = true }
protox = { workspace = true }

[[bench]]
name = "decode"
harness = false
required-features = ["arrow"]

[[bench]]
name = "parse"
harness = false

[lints]
workspace = true
