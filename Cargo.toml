[package]
name = "expfmt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Prometheus and OpenMetrics wire exposition format decoders"
license = "Apache-2.0"
repository = "https://github.com/prometheus/expfmt-rs"
keywords = ["prometheus", "openmetrics", "metrics", "opentelemetry", "arrow"]
categories = ["parser-implementations", "encoding"]

[workspace]
exclude = ["tests/otap-compat"]

[features]
default = ["arrow", "dto"]
arrow = ["dep:arrow-array", "dep:arrow-buffer", "dep:arrow-schema"]
discovery = ["dep:serde", "dep:serde_json", "dep:tokio"]
dto = ["dep:prost", "dep:prost-types"]
http-config = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[dependencies]
arrow-array = { version = "59", default-features = false, optional = true }
arrow-buffer = { version = "59", default-features = false, optional = true }
arrow-schema = { version = "59", default-features = false, optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "time"], optional = true }

[dev-dependencies]
benchfmt = { git = "https://github.com/bwplotka/benchfmt.rs" }
prost-build = "=0.14.4"
protox = "0.10"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-pki-types = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }

[[bench]]
name = "decode"
harness = false
required-features = ["arrow"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
